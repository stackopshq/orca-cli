# GitLab CI for orca-cli.
#
#   lint    ruff, mypy, gitleaks, pip-audit
#   test    pytest on every supported Python, coverage gate at 85 %
#   build   sdist + wheel, kept as an artifact
#   deploy  documentation to GitLab Pages (default branch only)
#           PyPI release through Trusted Publishing (v* tags only)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Branch pipelines are redundant when the branch has an open MR.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

stages:
  - lint
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"
  POETRY_SPEC: "poetry>=2.0,<3"

default:
  image: python:3.11-slim
  interruptible: true
  cache:
    key: pip-$CI_JOB_NAME_SLUG
    paths:
      - .cache/pip

.on_default_branch: &on_default_branch
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.on_release_tag: &on_release_tag
  - if: $CI_COMMIT_TAG =~ /^v/

# ── lint ────────────────────────────────────────────────────────────────

ruff:
  stage: lint
  script:
    - pip install ruff
    - ruff check .

mypy:
  stage: lint
  script:
    - pip install mypy types-PyYAML
    - mypy

secrets:
  stage: lint
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0  # scan the whole history, not just the tip
  cache: []
  script:
    - gitleaks detect --source=. --redact --exit-code=1 --verbose

pip-audit:
  stage: lint
  script:
    # poetry-plugin-export is split out of poetry 2.x.
    - pip install "$POETRY_SPEC" "poetry-plugin-export>=1.7" pip-audit
    # Audit only what orca ships (runtime deps), not the job's own tooling.
    - poetry export --format requirements.txt --without-hashes --only main --output runtime-requirements.txt
    - pip-audit --requirement runtime-requirements.txt

# ── test ────────────────────────────────────────────────────────────────

pytest:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  needs: [ruff, mypy]
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  cache:
    key: pip-py$PYTHON_VERSION
    paths:
      - .cache/pip
  script:
    - pip install "$POETRY_SPEC"
    - poetry install --with dev
    - >
      poetry run pytest tests/ -v --tb=short
      --cov=orca_cli --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=85
      --junitxml=report.xml
  coverage: '/^TOTAL\s+.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ── build ───────────────────────────────────────────────────────────────

build:
  stage: build
  needs: [pytest]
  script:
    - pip install "$POETRY_SPEC"
    - poetry build
    - ls -la dist/
    - python -m zipfile -l dist/*.whl | sed -n '1,20p'  # sed drains the pipe, unlike head
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

# ── deploy ──────────────────────────────────────────────────────────────

# No `needs`: deploy jobs wait for every earlier stage, security included.
pages:
  stage: deploy
  rules: *on_default_branch
  script:
    - pip install "$POETRY_SPEC"
    - poetry install --with docs --without dev
    - poetry run mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public

# PyPI Trusted Publishing: the GitLab OIDC token is exchanged for a
# short-lived upload token, no credential is stored in the project.
# PyPI matches namespace, project, `.gitlab-ci.yml` and environment `pypi`;
# keep those in sync with the publisher declared on pypi.org.
pypi:
  stage: deploy
  rules: *on_release_tag
  interruptible: false
  dependencies: [build]
  environment:
    name: pypi
    url: https://pypi.org/project/orca-openstackclient/
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  cache: []
  script:
    # Publish exactly what was built and tested: the tag must match the
    # version in pyproject.toml.
    - |
      VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')
      if [ "$CI_COMMIT_TAG" != "v$VERSION" ]; then
        echo "Tag $CI_COMMIT_TAG does not match pyproject.toml version $VERSION" >&2
        exit 1
      fi
    - pip install twine
    - twine check --strict dist/*
    - |
      TWINE_PASSWORD=$(python - <<'EOF'
      import json, os, sys, urllib.error, urllib.request
      req = urllib.request.Request(
          "https://pypi.org/_/oidc/mint-token",
          data=json.dumps({"token": os.environ["PYPI_ID_TOKEN"]}).encode(),
          headers={"Content-Type": "application/json"},
      )
      try:
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(json.load(resp)["token"])
      except urllib.error.HTTPError as err:
          sys.exit(f"PyPI token exchange failed ({err.code}): {err.read().decode()}")
      EOF
      ) || exit 1
      export TWINE_USERNAME=__token__ TWINE_PASSWORD
      twine upload --non-interactive dist/*
